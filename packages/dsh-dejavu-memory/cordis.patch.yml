# Plugin bundle for dsh-dejavu-memory.
# Registers the DejaVu memory tools (dejavu_boot / dejavu_read / dejavu_search /
# dejavu_create / dejavu_update / dejavu_delete). Configure your own DejaVu MCP server:
#
#   - id: dejavu
#     name: 'dsh-dejavu-memory'
#     config:
#       mcp_url: http://localhost:PORT/mcp
#       mcp_headers:
#         CF-Access-Client-Id: <client id>
#         CF-Access-Client-Secret: <client secret>
- insert:
    - id: dejavu
      name: 'dsh-dejavu-memory'
