# Plugin bundle for dsh-all-search.
# Registers the AnySearch search provider into ctx.web. Configure the API key
# via a credential ref (recommended) or a direct value:
#
#   - id: all-search
#     name: 'dsh-all-search'
#     config:
#       api_key_ref: ANYSEARCH_API_KEY   # env var name (recommended)
- insert:
    - id: all-search
      name: 'dsh-all-search'
