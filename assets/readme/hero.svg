    <rect x="952" y="182" width="184" height="92" rx="12" fill="#16202f" stroke="#2b3a52" stroke-width="2"/>
    <text x="970" y="216" font-size="26" font-weight="700" fill="#f6821f">pdf</text>
    <text x="970" y="244" font-size="16" fill="#9aa7b8">page rendered to PDF</text>
