<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" role="img" aria-label="dsh-atuin —— 把 dsh 里的每一句话记进 atuin 历史">
  <title>dsh-atuin —— 把 dsh 输入记进 atuin 历史</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101418"/>
      <stop offset="1" stop-color="#1b2129"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5555"/>
      <stop offset="1" stop-color="#ff8f8f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>

  <text x="64" y="86" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="46" font-weight="700" fill="#f5f7fa">dsh-atuin</text>
  <text x="64" y="128" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" fill="#9aa7b8">把 dsh 里的每一句话记进 shell 历史</text>
  <rect x="64" y="150" width="150" height="6" rx="3" fill="url(#accent)"/>

  <!-- terminal with history lines -->
  <rect x="64" y="182" width="600" height="92" rx="10" fill="#141a20" stroke="#2a3540" stroke-width="2"/>
  <text x="84" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#7f8ea3">$</text>
  <text x="100" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#e6edf3">dsh — "重构认证模块"</text>
  <text x="84" y="242" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#4c5a68">ctrl-r: dsh — "重构认证模块"</text>
  <rect x="84" y="256" width="420" height="3" rx="1.5" fill="#2a3540"/>
  <text x="84" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#ff5555">atuin history start -- "…"</text>

  <!-- recorded badge -->
  <rect x="720" y="182" width="416" height="92" rx="12" fill="#16202f" stroke="#2a3540" stroke-width="2"/>
  <text x="744" y="218" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#ff5555">已记录 ✓</text>
  <text x="744" y="248" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#9aa7b8">只记输入,不记回复</text>
</svg>
