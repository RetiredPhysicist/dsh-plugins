# Plugin bundle for @alex/dsh-cloudflare-browser-run.
# Load order and config follow the dsh bundle model: profiles list this
# package, this patch inserts the plugin row. Configure credentials via the
# profile/settings layer that overrides this row:
#
#   - id: browser-run
#     name: '@alex/dsh-cloudflare-browser-run'
#     config:
#       cf_api_token_ref: CF_API_TOKEN   # env var name (recommended)
#       cf_account_id: <your account id>
- insert:
    - id: browser-run
      name: '@alex/dsh-cloudflare-browser-run'
