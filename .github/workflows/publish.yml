name: Publish

on:
  push:
    tags:
      - "dsh-*-v*"

# Two tags pushed together would otherwise publish in parallel.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # npm provenance rejects self-hosted runners, including Blacksmith.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"

      - name: Resolve package from tag
        id: package
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          package="${tag%-v*}"
          version="${tag##*-v}"
          test -d "packages/$package" || { echo "unknown package: $package" >&2; exit 1; }
          node -e 'const p=require(process.argv[1]); if (p.version !== process.argv[2]) process.exit(1)' "$PWD/packages/$package/package.json" "$version"
          echo "name=$package" >> "$GITHUB_OUTPUT"
          echo "dir=packages/$package" >> "$GITHUB_OUTPUT"

      - name: Install
        working-directory: ${{ steps.package.outputs.dir }}
        env:
          npm_config_cache: ${{ runner.temp }}/npm-cache
        run: npm ci --no-audit --no-fund

      # A tag must not publish code CI never checked.
      - name: Typecheck
        working-directory: ${{ steps.package.outputs.dir }}
        run: npm run typecheck --if-present

      - name: Test
        working-directory: ${{ steps.package.outputs.dir }}
        run: |
          if npm run | grep -q '^  test:ci$'; then
            npm run test:ci
          elif npm run | grep -q '^  test:unit$'; then
            npm run test:unit
          else
            npm test --if-present
          fi

      - name: Build
        working-directory: ${{ steps.package.outputs.dir }}
        run: npm run build --if-present


      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ${{ steps.package.outputs.dir }}
          format: spdx-json
          artifact-name: ${{ steps.package.outputs.name }}-sbom
          upload-artifact: true

      - name: Publish
        working-directory: ${{ steps.package.outputs.dir }}
        run: npx npm@12 publish --access public
