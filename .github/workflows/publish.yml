name: Publish

on:
  push:
    tags:
      - "dsh-*-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Resolve package from tag
        id: package
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          package="${tag%-v*}"
          version="${tag##*-v}"
          test -d "packages/$package" || { echo "unknown package: $package" >&2; exit 1; }
          node -e 'const p=require(process.argv[1]); if (p.version !== process.argv[2]) process.exit(1)' "packages/$package/package.json" "$version"
          echo "name=$package" >> "$GITHUB_OUTPUT"
          echo "dir=packages/$package" >> "$GITHUB_OUTPUT"

      - name: Install
        working-directory: ${{ steps.package.outputs.dir }}
        run: npm ci || npm install

      - name: Build
        working-directory: ${{ steps.package.outputs.dir }}
        run: npm run build --if-present

      - name: Publish
        working-directory: ${{ steps.package.outputs.dir }}
        run: npx npm@latest publish --access public
