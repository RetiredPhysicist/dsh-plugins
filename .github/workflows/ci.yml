name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      packages: ${{ steps.pick.outputs.packages }}
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          fetch-depth: 0

      - name: Pick changed packages
        id: pick
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            packages=$(find packages -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | paste -sd, -)
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            packages=$(git diff --name-only "$base" HEAD -- packages | cut -d/ -f2 | sort -u | paste -sd, -)
          else
            before="${{ github.event.before }}"
            if [ "$before" = "0000000000000000000000000000000000000000" ]; then
              packages=$(find packages -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | paste -sd, -)
            else
              packages=$(git diff --name-only "$before" HEAD -- packages | cut -d/ -f2 | sort -u | paste -sd, -)
            fi
          fi
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          # `cut -d/ -f2` also yields files directly under packages/, which are
          # not directories and would fail npm ci, so intersect with the real
          # package dirs. When the intersection is empty — a root-only change —
          # fall back to every package: an empty matrix is a workflow error, and
          # skipping the test job let such a push report green with nothing run.
          json=$(find packages -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort \
            | jq -R -s -c --arg want "$packages" '
                (split("\n") | map(select(. != ""))) as $all
                | ($want | split(",") | map(select(. != ""))) as $changed
                | ($all - ($all - $changed)) as $hit
                | if ($hit | length) > 0 then $hit else $all end')
          echo "matrix=$json" >> "$GITHUB_OUTPUT"
          echo "Packages: ${packages:-none}"

  test:
    needs: changed
    # Every push must run tests: a root-only change moves no package, and
    # skipping the matrix made that push report green with nothing executed.
    # An empty matrix is not valid for fromJSON, so fall back to every package.
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changed.outputs.matrix) }}
    steps:
      - uses: useblacksmith/checkout@v1

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: packages/${{ matrix.package }}/package-lock.json

      - name: Install
        working-directory: packages/${{ matrix.package }}
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: packages/${{ matrix.package }}
        run: npm run typecheck --if-present

      - name: Test
        working-directory: packages/${{ matrix.package }}
        run: |
          if npm run | grep -q '^  test:ci$'; then
            npm run test:ci
          elif npm run | grep -q '^  test:unit$'; then
            npm run test:unit
          else
            npm test --if-present
          fi
