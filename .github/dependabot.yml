# Dependabot: weekly grouped updates. Patch/minor/security auto-merged via workflow.
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/packages/dsh-all-search"
      - "/packages/dsh-atuin"
      - "/packages/dsh-cloudflare-browser-run"
      - "/packages/dsh-codebuddy-sdk"
      - "/packages/dsh-dejavu-memory"
      - "/packages/dsh-gemini-multimodal"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      npm-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"